<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas Particle Journey</title>
  <script>
    window.loadChristmasAsset = sources => new Promise((resolve, reject) => {
      let i = 0;
      const next = () => {
        if (i >= sources.length) return reject(new Error('asset unavailable'));
        const s = document.createElement('script'); s.src = sources[i++];
        s.onload = resolve; s.onerror = () => { s.remove(); next(); }; document.head.appendChild(s);
      }; next();
    });
    Promise.all([
      loadChristmasAsset(['https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js','https://unpkg.com/three@0.160.1/build/three.min.js']),
      loadChristmasAsset(['https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js','https://unpkg.com/@mediapipe/camera_utils/camera_utils.js']),
      loadChristmasAsset(['https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js','https://unpkg.com/@mediapipe/hands/hands.js'])
    ]).then(() => document.dispatchEvent(new Event('christmas-assets-ready')))
      .catch(() => document.addEventListener('DOMContentLoaded', () => { document.body.dataset.error='网络资源加载失败，请联网后刷新'; }));
  </script>
  <style>
    :root { color-scheme:dark; --fg:#fff8ef; --muted:#a9a5ae; --line:rgba(255,255,255,.16); --glass:rgba(16,12,27,.66); --gold:#ffd873; --red:#ff637c; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; background:#05030c; color:var(--fg); font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; }
    body:before { content:""; position:fixed; inset:0; background:radial-gradient(circle at 50% 42%,rgba(74,28,95,.2),transparent 42%),radial-gradient(circle at 80% 10%,rgba(33,91,114,.14),transparent 34%); pointer-events:none; }
    canvas { display:block; width:100vw; height:100vh; }
    .top { position:fixed; inset:0 0 auto; height:82px; display:flex; align-items:center; justify-content:space-between; padding:0 30px; background:linear-gradient(180deg,rgba(4,3,12,.78),transparent); }
    .brand { display:flex; gap:12px; align-items:center; }
    .flake { width:30px; height:30px; display:grid; place-items:center; border:1px solid rgba(255,216,115,.75); border-radius:50%; color:var(--gold); font-size:18px; }
    h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:.02em; } .sub { display:block; margin-top:4px; color:var(--muted); font-size:11px; letter-spacing:.12em; }
    .status { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12px; } .dot { width:7px; height:7px; border-radius:50%; background:#5a5965; } .dot.live { background:#79f5c7; box-shadow:0 0 14px #79f5c7; }
    .controls { position:fixed; left:24px; bottom:24px; width:min(340px,calc(100vw - 48px)); padding:17px; border:1px solid var(--line); border-radius:9px; background:var(--glass); backdrop-filter:blur(20px); }
    .control-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; } .control-title { font-size:13px; font-weight:600; } .stage { color:var(--gold); font-size:11px; letter-spacing:.08em; }
    .steps { display:flex; gap:5px; margin-bottom:14px; } .step { flex:1; padding:8px 4px; color:#a7a3b0; border:1px solid transparent; background:rgba(255,255,255,.045); border-radius:5px; text-align:center; font-size:11px; cursor:pointer; } .step.active { color:#fff; border-color:rgba(255,216,115,.7); background:rgba(255,216,115,.13); }
    .row { display:flex; gap:8px; } button { font:inherit; } .action { flex:1; border:1px solid var(--line); border-radius:5px; padding:8px 10px; color:#e8e4eb; background:rgba(255,255,255,.05); cursor:pointer; } .action:hover { border-color:rgba(255,216,115,.65); color:#fff; }
    .hint { margin-top:12px; color:#817d8b; font-size:10px; line-height:1.5; } .hint strong { color:#bdb8c8; font-weight:500; }
    .tools { position:fixed; top:24px; right:24px; display:flex; gap:7px; } .icon { width:38px; height:38px; border:1px solid var(--line); border-radius:6px; color:#e5e0e9; background:rgba(15,12,25,.62); cursor:pointer; font-size:17px; }
    #video { position:fixed; right:20px; bottom:20px; width:112px; height:84px; object-fit:cover; opacity:0; transform:scaleX(-1); border-radius:5px; pointer-events:none; } #video.ready { opacity:.32; }
    body[data-error]:after { content:attr(data-error); position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); padding:14px 18px; border:1px solid rgba(255,99,124,.5); border-radius:7px; background:rgba(36,11,27,.9); color:#ffd3d9; font-size:13px; }
    @media(max-width:680px){.top{padding:0 17px;height:67px}.controls{left:12px;bottom:12px;width:calc(100vw - 24px)}.tools{top:14px;right:14px}.status{display:none}}
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="圣诞粒子互动模型"></canvas>
  <video id="video" playsinline muted></video>
  <header class="top"><div class="brand"><div class="flake">✦</div><div><h1>Christmas Particle Journey</h1><span class="sub">A GESTURE-DRIVEN HOLIDAY STORY</span></div></div><div class="status"><span class="dot" id="dot"></span><span id="status">等待摄像头</span></div></header>
  <div class="tools"><button class="icon" id="camera" aria-label="切换摄像头">◉</button><button class="icon" id="fullscreen" aria-label="全屏">⛶</button></div>
  <aside class="controls"><div class="control-head"><span class="control-title">Journey</span><span class="stage" id="stageText">01 / NEBULA</span></div><div class="steps"><button class="step active" data-stage="0">星云</button><button class="step" data-stage="1">圣诞树</button><button class="step" data-stage="2">祝福</button></div><div class="row"><button class="action" id="prev">‹ 上一步</button><button class="action" id="next">下一步 ›</button></div><div class="hint"><strong>手势</strong> 捏合或手掌前后移动，连续缩放两次完成旅程。<br><strong>备用</strong> 滚轮切换阶段，拖动旋转粒子。</div></aside>
  <script>
  document.addEventListener('christmas-assets-ready', () => {
    const N=24000, canvas=document.getElementById('canvas'), video=document.getElementById('video');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x05030c,1);
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(49,innerWidth/innerHeight,.1,100); camera.position.z=17;
    const group=new THREE.Group(); scene.add(group);
    const positions=new Float32Array(N*3), targets=new Float32Array(N*3), base=new Float32Array(N*3), seeds=new Float32Array(N), colors=new Float32Array(N*3), targetColors=new Float32Array(N*3), phase=new Float32Array(N);
    for(let i=0;i<N;i++){seeds[i]=Math.random();phase[i]=Math.random()*Math.PI*2;}
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(positions,3)); geo.setAttribute('aColor',new THREE.BufferAttribute(colors,3));
    const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uSize:{value:2.4},uTime:{value:0},uEnergy:{value:1}},vertexShader:`attribute vec3 aColor; uniform float uSize,uTime,uEnergy; varying vec3 vColor; varying float vAlpha; void main(){vec3 p=position; p+=normalize(p+vec3(.001))*sin(uTime*1.2+position.x*5.+position.y*3.)*.025*uEnergy; vec4 mv=modelViewMatrix*vec4(p,1.); gl_PointSize=uSize*(112./-mv.z); gl_Position=projectionMatrix*mv; vColor=aColor; vAlpha=.48+fract(position.x*17.+position.y*11.)*.52;}`,fragmentShader:`varying vec3 vColor; varying float vAlpha; void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.04,d)*vAlpha;gl_FragColor=vec4(vColor,a);}`});
    const points=new THREE.Points(geo,mat); group.add(points);
    const rgb=(hex,i,arr)=>{const c=new THREE.Color(hex);arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;};
    const set=(x,y,z,i)=>{targets[i*3]=x;targets[i*3+1]=y;targets[i*3+2]=z;};
    const glyphs={M:['10001','11011','10101','10101','10001','10001','10001'],E:['11111','10000','10000','11110','10000','10000','11111'],R:['11110','10001','10001','11110','10100','10010','10001'],Y:['10001','10001','01010','00100','00100','00100','00100'],C:['01111','10000','10000','10000','10000','10000','01111'],H:['10001','10001','10001','11111','10001','10001','10001'],I:['11111','00100','00100','00100','00100','00100','11111'],S:['01111','10000','10000','01110','00001','00001','11110'],T:['11111','00100','00100','00100','00100','00100','00100'],A:['01110','10001','10001','11111','10001','10001','10001']};
    function textPoint(i){const words=[['MERRY',2.2],['CHRISTMAS',-.5]]; const line=i%2; const word=words[line][0]; const scale=.58; const width=word.length*1.32-.25; let char,row,col,g; for(let tries=0;tries<30;tries++){char=Math.floor(Math.random()*word.length);g=glyphs[word[char]];row=Math.floor(Math.random()*7);col=Math.floor(Math.random()*5);if(g[row][col]==='1')break;} let offset=0; for(let c=0;c<char;c++)offset+=1.32; const x=(offset-width/2)+col*scale, y=words[line][1]+(3-row)*scale; set(x+(Math.random()-.5)*.1,y+(Math.random()-.5)*.1,(Math.random()-.5)*.16,i); }
    function build(stage){for(let i=0;i<N;i++){const q=seeds[i],a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random());let x=0,y=0,z=0;
      if(stage===0){const arm=Math.floor(q*5),rr=Math.pow(Math.random(),.45)*5.2,th=a+arm*Math.PI*2/5+rr*.9;x=Math.cos(th)*rr;y=Math.sin(th)*rr;z=(Math.random()-.5)*(1.1+rr*.42);rgb(q<.33?'#ff6b88':q<.66?'#7b8cff':'#ffd36e',i,targetColors);}
      if(stage===1){if(q<.08){x=(Math.random()-.5)*.72;y=-4.45+Math.random()*1.35;z=(Math.random()-.5)*.72;rgb('#8d563b',i,targetColors);}else if(q>.967){const t=a,rr=.72*(.55+.45*r),rad=Math.floor(t/(Math.PI/5))%2===0?rr:rr*.4;x=Math.cos(t)*rad;y=3.15+Math.sin(t)*rad;z=(Math.random()-.5)*.2;rgb('#ffd86a',i,targetColors);}else if(q>.88&&q<.925){const tier=Math.floor(Math.random()*6),yy=-3.5+tier*.92,rad=(1-(yy+3.5)/6.2)*3.25+.08;x=rad*Math.cos(a);y=yy;z=rad*Math.sin(a);rgb(q<.905?'#ffd86a':'#ff596f',i,targetColors);}else{y=-3.72+Math.random()*5.95;const max=Math.max(.16,(1-(y+3.72)/6.2)*3.55),rr=Math.pow(Math.random(),.48)*max;x=rr*Math.cos(a);z=rr*Math.sin(a);rgb(q<.48?'#1fc978':q<.75?'#0b8f63':'#53ed9e',i,targetColors);}}
      if(stage===2){textPoint(i);rgb(q<.5?'#ff6c85':q<.8?'#ffd76b':'#fff5e6',i,targetColors);} else set(x,y,z,i);
    }base.set(targets);geo.attributes.position.needsUpdate=true;geo.attributes.aColor.needsUpdate=true;}
    build(0); positions.set(base); colors.set(targetColors); geo.attributes.position.needsUpdate=true;geo.attributes.aColor.needsUpdate=true;
    let current=0; const state={spread:1,pinch:1,rotate:0,depth:0,energy:1,drag:false,lastX:.5,lastZoom:1}; let hands=null,mpCamera=null,handOn=true,zoomLock=0;
    const stageText=document.getElementById('stageText'), steps=[...document.querySelectorAll('.step')], status=document.getElementById('status'), dot=document.getElementById('dot');
    function setStage(next){current=(next+3)%3;build(current);stageText.textContent=`0${current+1} / ${current===0?'NEBULA':current===1?'CHRISTMAS TREE':'MERRY CHRISTMAS'}`;steps.forEach(b=>b.classList.toggle('active',+b.dataset.stage===current));}
    document.getElementById('prev').onclick=()=>setStage(current-1);document.getElementById('next').onclick=()=>setStage(current+1);steps.forEach(b=>b.onclick=()=>setStage(+b.dataset.stage));
    document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    document.getElementById('camera').onclick=()=>{handOn=!handOn;if(handOn)startHands();else{status.textContent='手势已暂停';video.classList.remove('ready');}};
    function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
    function onHand(result){const h=result.multiHandLandmarks&&result.multiHandLandmarks[0];if(!h){status.textContent='摄像头已连接 · 等待手掌';return;}video.classList.add('ready');dot.classList.add('live');status.textContent='手势追踪中';const palm=Math.max(.03,dist(h[0],h[9])),pinch=dist(h[4],h[8])/palm;state.pinch=THREE.MathUtils.clamp(.6+pinch*.8,.55,1.8);const zoom=THREE.MathUtils.clamp((palm-.13)*7+1,.35,2.9);state.depth=THREE.MathUtils.lerp(state.depth,(zoom-1)*2,.18);const dx=h[8].x-state.lastX;state.lastX=h[8].x;state.rotate=THREE.MathUtils.lerp(state.rotate,dx*7,.25);if(zoomLock<=0&&Math.abs(zoom-state.lastZoom)>.65){setStage(current+(zoom>state.lastZoom?1:-1));zoomLock=34;}state.lastZoom=THREE.MathUtils.lerp(state.lastZoom,zoom,.1);}
    function startHands(){if(hands||!handOn)return;status.textContent='请求摄像头权限';hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.62,minTrackingConfidence:.58});hands.onResults(onHand);if(!navigator.mediaDevices){status.textContent='摄像头不可用 · 可用滚轮切换';return;}navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}}).then(stream=>{video.srcObject=stream;video.play();mpCamera=new Camera(video,{onFrame:async()=>{if(handOn)await hands.send({image:video})},width:640,height:480});mpCamera.start();}).catch(()=>{status.textContent='摄像头权限未开启 · 可用滚轮切换';});}
    startHands();addEventListener('wheel',e=>setStage(current+(e.deltaY>0?1:-1)),{passive:true});addEventListener('pointerdown',e=>{state.drag=true;state.lastX=e.clientX});addEventListener('pointerup',()=>state.drag=false);addEventListener('pointermove',e=>{if(state.drag)state.rotate=(e.clientX-state.lastX)*.008,state.lastX=e.clientX});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    const clock=new THREE.Clock();function tick(){const t=clock.getElapsedTime();if(zoomLock>0)zoomLock--;mat.uniforms.uTime.value=t;const targetScale=state.spread*state.pinch,pos=geo.attributes.position.array,e=state.energy;for(let i=0;i<N;i++){const k=i*3,w=Math.sin(t*1.2+phase[i])*.028*e;pos[k]+=(base[k]*targetScale+w-pos[k])*.075;pos[k+1]+=(base[k+1]*targetScale+w-pos[k+1])*.075;pos[k+2]+=(base[k+2]*targetScale+w-pos[k+2])*.075;}geo.attributes.position.needsUpdate=true;group.rotation.y+=state.rotate*.035;group.rotation.y+=.0007;group.rotation.x=THREE.MathUtils.lerp(group.rotation.x,Math.sin(t*.2)*.07,.035);camera.position.z=THREE.MathUtils.lerp(camera.position.z,17-state.depth,.05);renderer.render(scene,camera);requestAnimationFrame(tick);}tick();
  });
  </script>
</body>
</html>
